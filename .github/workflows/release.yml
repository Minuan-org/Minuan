name: Minuan Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for the Minuan release"
        required: true
        default: "v1.1.0"
        type: string
      source_ref:
        description: "Branch or commit to build from"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtwebengine qtwebchannel qtpositioning"
          archives: "qtbase qtdeclarative"
          cache: true

      - name: Configure
        run: cmake -S . -B out/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build out/build --config Release --parallel

      - name: Test HTML6 conversion
        run: ctest --test-dir out/build -C Release --output-on-failure

      - name: Install Minuan
        run: cmake --install out/build --config Release --prefix package

      - name: Verify installed package files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "package/bin/Minuan.exe",
            "package/bin/websites.json",
            "package/bin/home.html"
          )
          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required installed file is missing: $file"
            }
          }

      - name: Deploy Qt runtime and browser configuration
        shell: pwsh
        run: |
          $executable = "package/bin/Minuan.exe"
          if (!(Test-Path $executable)) {
            throw "Minuan.exe was not produced by the install step."
          }

          New-Item -ItemType Directory -Force "package/bin" | Out-Null
          Copy-Item "browser/websites.json" "package/bin/websites.json" -Force

          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe"
          if (!(Test-Path $windeployqt)) {
            throw "windeployqt.exe was not found in the installed Qt directory."
          }

          # Keep WebEngine locale files: Chromium uses them at runtime.
          & $windeployqt --release --compiler-runtime $executable
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $webEngineProcess = Get-ChildItem -Path "package/bin" -Filter "QtWebEngineProcess.exe" -Recurse -File |
            Select-Object -First 1
          if (!$webEngineProcess) {
            throw "QtWebEngineProcess.exe is missing from the portable package."
          }

          foreach ($resourceName in @(
            "qtwebengine_resources.pak",
            "icudtl.dat",
            "v8_context_snapshot.bin"
          )) {
            $resource = Get-ChildItem -Path "package/bin" -Filter $resourceName -Recurse -File |
              Select-Object -First 1
            if (!$resource) {
              throw "Required Qt WebEngine resource is missing: $resourceName"
            }
          }

          $localeDirectory = Get-ChildItem -Path "package/bin" -Directory -Filter "qtwebengine_locales" -Recurse |
            Select-Object -First 1
          if (!$localeDirectory) {
            throw "Qt WebEngine locale directory is missing from the portable package."
          }
          $localeFile = Get-ChildItem -Path $localeDirectory.FullName -Filter "*.pak" -File |
            Select-Object -First 1
          if (!$localeFile) {
            throw "Qt WebEngine locale files are missing from the portable package."
          }

          @"
          MINUAN 1.1.0 — WINDOWS x64

          1. Extract the whole ZIP file into a folder.
          2. Open Minuan.exe from that folder.
          3. Keep the other files and folders beside Minuan.exe.

          Minuan uses the Sunay rendering component and Qt WebEngine.
          Only HTTPS websites in the approved-sites list can be opened.
          HTML6 support is an early conversion feature. CSS Next, JS-squared
          and the HTML6 server runtime are not complete yet.
          "@ | Set-Content -Path "package/bin/README.txt" -Encoding UTF8

          Compress-Archive -Path "package/bin/*" -DestinationPath "Minuan-Windows-x64.zip" -Force
          if (!(Test-Path "Minuan-Windows-x64.zip") -or
              (Get-Item "Minuan-Windows-x64.zip").Length -lt 1000000) {
            throw "The portable Minuan ZIP was not created correctly."
          }

      - name: Attach package and correct release notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.source_ref }}
          name: Minuan ${{ inputs.tag }}
          body: |
            # Minuan ${{ inputs.tag }}

            Minuan is a SimVerse browser powered by the Sunay rendering pipeline.

            ### Included
            - Tabbed browser window and navigation controls
            - HTTPS allowed-site filtering, including Google UK and Google.com
            - Google search directly from the address bar
            - Built-in SimVerse gateway home screen
            - Local HTML6 project opening from the home screen
            - HTML6-to-HTML conversion pipeline
            - Sunay rendering pipeline with Qt WebEngine / Chromium
            - Windows x64 package with deployed Qt runtime

            ### Development status
            This is an experimental early release. HTML6 support is still developing; CSS Next, the JS-squared runtime and HTML6 server runtime are not complete.
          files: Minuan-Windows-x64.zip
          fail_on_unmatched_files: true
